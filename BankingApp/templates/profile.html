<!-- templates/profile.html -->
{% extends "base.html" %}
{% block title %}Profile Management{% endblock %}

{% block content %}
<h2>Profile Management</h2>



<form method="POST" action="{{ url_for('profile.profile') }}">
  <div class="mb-3">
    <label for="first_name" class="form-label">First Name</label>
    <input type="text" class="form-control" id="first_name" name="first_name" value="{{ user.first_name or '' }}">
  </div>

  <div class="mb-3">
    <label for="last_name" class="form-label">Last Name</label>
    <input type="text" class="form-control" id="last_name" name="last_name" value="{{ user.last_name or '' }}">
  </div>

  <!-- Radio Buttons: Gender -->
  <div class="mb-3">
    <label class="form-label">Gender</label><br>
    <input type="radio" id="gender_male" name="gender" value="male"
           {% if user.gender == 'male' %}checked{% endif %}>
    <label for="gender_male">Male</label>
    <input type="radio" id="gender_female" name="gender" value="female"
           {% if user.gender == 'female' %}checked{% endif %}>
    <label for="gender_female">Female</label>
  </div>

  <!-- Checkbox: Subscribe to Newsletter -->
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="newsletter" name="newsletter"
           {% if user.newsletter_subscribed %}checked{% endif %}>
    <label for="newsletter" class="form-check-label">Subscribe to Newsletter</label>
  </div>

  <button type="submit" class="btn btn-primary">Update Profile</button>
</form>
{% endblock %}
